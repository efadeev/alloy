name: Test Pyroscope PR
on:
  pull_request:

permissions:
  contents: read

jobs:
  test_pyroscope:
    name: Test pyroscope packages on Linux
    runs-on: ubuntu-latest
    if: >
      github.actor == 'korniltsev-grafanista' ||
      github.actor == 'simonswine' ||
      github.actor == 'aleks-p' ||
      github.actor == 'marcsanmi'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: v2026.8.10
          sha256: 1f5e8795d24073904ef20ba70c1250ad6389d8c5672226d152e0ed24909ba72f
          install_args: go

      - run: sudo make test-pyroscope
